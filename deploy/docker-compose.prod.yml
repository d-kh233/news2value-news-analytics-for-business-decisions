# Сервер: добавляет к docker-compose.yml фронтенд на порту 80.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Наружу открыт только web (80). API и база слушают 127.0.0.1 — снаружи их не видно.
services:
  api:
    environment:
      # без ключа модели на сервере: ответы из записанного кэша (replay_cache/), промах — карточка по шаблонам
      LLM_MODE: ${LLM_MODE:-replay}

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
