# Один адрес для всего сервиса: интерфейс, API (/api/...) и документация API (/docs).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Имя api разрешается при каждом запросе через DNS Docker: если API пересобрали и у контейнера
    # сменился адрес, интерфейс продолжит работать без перезапуска web
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/companies → http://api:8000/companies — так же, как прокси Vite при разработке
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Документация API (Swagger) — страница грузит схему с /openapi.json
    location = /docs { proxy_pass $api; }
    location = /openapi.json { proxy_pass $api; }

    # Файлы сборки с хэшем в имени можно кэшировать надолго
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Маршруты React (/analytics/..., /insights/...) открываются напрямую и после перезагрузки
    location / {
        try_files $uri $uri/ /index.html;
    }
}
