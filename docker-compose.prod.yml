# Сервер: интерфейс, API, worker и база за обратным прокси Caddy, всё на одном адресе. Пошагово — docs/DEPLOY.md.
#   docker compose -f docker-compose.prod.yml up -d --build
# Отдельный файл, локальный docker-compose.yml не меняется и вместе с этим не нужен.
#   • наружу открыт только Caddy (80 и 443); интерфейс, API и база — только во внутренней сети Docker;
#   • DOMAIN задан — Caddy сам получает HTTPS-сертификат; пусто — работает по IP на http;
#   • все настройки и секреты — из .env на сервере (без POSTGRES_* не запустится).
name: news2value

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports нет: база не видна снаружи, к ней ходят только api и worker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: news2value-backend:prod
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # healthy = миграции применены и API отвечает (по нему стартуют worker и caddy)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    # порт 8000 только для других контейнеров (caddy), не для интернета
    expose:
      - "8000"
    volumes:
      # CSV кейса, если их скопировали на сервер (необязательно: без них — синтетика из образа)
      - ./data/raw:/data/raw:ro

  worker:
    image: news2value-backend:prod
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    # worker раз в 10 с обновляет файл-пульс; старше минуты — процесс завис или упал
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # интерфейс: сборка React → статика в nginx (deploy/web.Dockerfile); наружу не открыт, его отдаёт Caddy
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: news2value-web:prod
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    environment:
      # app.example.ru — HTTPS с автоматическим сертификатом; пусто — :80, вход по IP
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # сертификаты и настройки Caddy переживают перезапуск
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  caddy_data:
  caddy_config:
