services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # только для этого компьютера (127.0.0.1), не для всей сети;
      # порт поменяй в .env, если 5432 занят (например, Postgres в Windows)
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # корень репозитория: в образ нужны agent/ и llm/ (см. backend/Dockerfile)
      context: .
      dockerfile: backend/Dockerfile
    # один образ на api и worker
    image: news2value-backend:local
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # healthy = миграции применены и API отвечает (по нему стартует worker)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      # только для этого компьютера (127.0.0.1), не для всей сети
      - "127.0.0.1:8000:8000"
    volumes:
      # моковые данные API (пока нет БД); путь /data/mocks ищет app/services/mock_store.py
      - ./data/mocks:/data/mocks:ro
      # CSV банка для scripts/load_csv.py (только чтение, в образ не попадают)
      - ./data/raw:/data/raw:ro
      # демо-профили для scripts/load_demo_profiles.py
      - ./data/demo_profiles:/data/demo_profiles:ro
      # список источников для scripts/ingest.py (PDF берутся из /data/raw/analytics)
      - ./config:/config:ro

  # фоновые задачи (refresh): тот же образ, другая команда; задачи берёт из таблицы jobs
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: news2value-backend:local
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      # миграции накатывает api при старте — ждём, пока он поднимется
      api:
        condition: service_healthy

volumes:
  pgdata:
