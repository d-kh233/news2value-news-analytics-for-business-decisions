services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # только для этого компьютера (127.0.0.1), не для всей сети;
      # порт поменяй в .env, если 5432 занят (например, Postgres в Windows)
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # корень репозитория: в образ нужны agent/ и llm/ (см. backend/Dockerfile)
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # только для этого компьютера (127.0.0.1), не для всей сети
      - "127.0.0.1:8000:8000"
    volumes:
      # моковые данные API (пока нет БД); путь /data/mocks ищет app/services/mock_store.py
      - ./data/mocks:/data/mocks:ro
      # CSV банка для scripts/load_csv.py (только чтение, в образ не попадают)
      - ./data/raw:/data/raw:ro

volumes:
  pgdata:
