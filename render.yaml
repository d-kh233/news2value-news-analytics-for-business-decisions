# Бесплатный деплой на Render (render.com) — Blueprint: New → Blueprint → этот репозиторий, ветка main.
# Подробно — deploy/README.md, раздел «Бесплатно на Render».
#
# Два сервиса: API (Docker, бэкенд + агент) и интерфейс (статический сайт).
# Без базы: API работает на моках (c-001…), агент — на записанном кэше ответов модели (LLM_MODE=replay),
# ключ модели на Render не нужен. Бесплатный сервис засыпает после 15 минут без запросов
# и просыпается примерно за минуту — перед показом откройте ссылку заранее.
#
# Адреса ниже — по именам сервисов. Если Render занял имя и выдал адрес с суффиксом,
# поправьте VITE_API_BASE_URL и CORS_ORIGINS в настройках сервисов и пересоберите.
services:
  - type: web
    name: news2value-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # без миграций: базы на Render нет, API берёт данные из моков
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: LLM_MODE
        value: replay
      # три настройки ниже — те же, с которыми записан кэш (python -m agent record-demo), иначе промахи
      - key: AGENT_TODAY
        value: "2026-10-22"
      - key: LLM_USE_SMART
        value: "1"
      - key: LLM_USE_CRITIC
        value: "1"
      - key: CORS_ORIGINS
        value: '["https://news2value-web.onrender.com"]'

  - type: web
    name: news2value-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://news2value-api.onrender.com
    routes:
      # React-роутер: любые пути отдаёт index.html
      - type: rewrite
        source: /*
        destination: /index.html
